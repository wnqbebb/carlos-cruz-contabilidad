# Reglas de gitleaks para Carlos Cruz (v2.3 · Fase 6, control C35).
# Además de las reglas de fábrica (claves de nube, tokens…), se buscan datos personales y
# cadenas de conexión. Los datos ficticios de pruebas y demostración están en la lista blanca.
title = "Carlos Cruz"

[extend]
useDefault = true

[[rules]]
id = "cadena-conexion-con-clave"
description = "Cadena de conexión con usuario y contraseña"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis)://[^\s:/@]+:([^\s@/]{4,})@[^\s'"]+'''
# El secreto es la contraseña (así la lista de permitidos reconoce los marcadores de la documentación).
secretGroup = 1
keywords = ["postgres", "mysql", "mongodb", "redis"]

[[rules]]
id = "cedula-colombiana"
description = "Cédula de ciudadanía junto a su rótulo"
regex = '''(?i)\b(?:c\.?\s?c\.?|c[ée]dula|identificaci[óo]n)\s*(?:n[o°º]\.?)?\s*[:#]?\s*(\d{1,3}(?:\.\d{3}){2,3}|\d{6,10})\b'''
secretGroup = 1
keywords = ["c.c", "cc", "cedula", "cédula", "identificacion", "identificación"]

[[rules]]
id = "nit-colombiano"
description = "NIT junto a su rótulo"
regex = '''(?i)\bnit\s*[:#]?\s*(\d{3}\.?\d{3}\.?\d{3})(?:-\d)?\b'''
secretGroup = 1
keywords = ["nit"]

[[rules]]
id = "clave-de-sesion-o-datos"
description = "Claves de la aplicación escritas en un archivo"
regex = '''(?i)\b(CLAVE_SESION|CLAVE_DATOS|CC_CLAVE_HASH|CC_CLAVE_DATOS)\s*=\s*['"]?([^\s'"#]{12,})'''
secretGroup = 2
keywords = ["clave_sesion", "clave_datos", "cc_clave_hash"]

[allowlist]
description = "Datos ficticios de pruebas, demostración y documentación"
paths = [
  '''backend/tests/''',
  '''backend/app/demo/''',
  '''docs/demo/''',
  '''frontend/scripts/''',
  '''data/seguridad/contrasenas_comunes\.txt''',
  '''data/seguridad/supabase-ca-2021\.crt''',
  '''frontend/package-lock\.json''',
  '''backend/requirements\.lock''',
  # Informes sobre los clientes de demostración (datos inventados)
  '''docs/v22/fase-9.md''',
]
regexes = [
  # NIT y cédulas ficticias de pruebas y demostración, y ejemplos de documentación
  '''9\d{2}\.?(?:000|100|111|123|500|555)\.?\d{3}''',
  '''1000000\d''',
  '''(?i)usuario:clave@|u:p@|\*\*\*''',
  # Ejemplos de documentación: referencia de proyecto inventada y contraseña de ejemplo
  '''abcdefghijklmnop''',
  '''\[YOUR-PASSWORD\]|\[SU-CONTRASENA\]|MiClaveReal123''',
  # Cédula de la representante legal del cliente de demostración
  '''31\.?456\.?789''',
]
