# ─────────────────────────────────────────────────────────────────────────────
#  CARLOS CRUZ · backend en Render (v2.4)
#
#  Render se usa con Docker para incluir Tesseract OCR en español con versión
#  fijada y librerías de procesamiento contable y tributario.
#
#  Despliegue:
#    1. En Render: New → Blueprint → elegir el repositorio (wnqbebb/carlos-cruz-contabilidad).
#    2. Llenar las variables marcadas como sync:false.
#    3. Asignar la URL del backend en frontend/vercel.json como destino de /api/(.*).
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: carloscruz-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/salud
    envVars:
      - key: ALMACENAMIENTO
        value: supabase
      # Supabase → Project Settings → Database → Connection string (URI) puerto 6543
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CLAVE_SESION
        generateValue: true
      # Código de un solo uso para autorizar la creación de cuenta en la nube (Bloque 1.3)
      - key: CC_CODIGO_INSTALACION
        sync: false
      # URL del frontend en Vercel
      - key: CORS_ORIGENES
        value: https://carlos-cruz-contabilidad.vercel.app,http://localhost:5173,http://localhost:8000
