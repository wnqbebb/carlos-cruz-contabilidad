# ─────────────────────────────────────────────────────────────────────────────
#  CARLOS CRUZ · backend en Render (plan gratuito)
#
#  El usuario entra SIEMPRE por https://carlos-cruz-contabilidad.vercel.app.
#  Vercel reenvía /api/* a este servicio (frontend/vercel.json). Docker incluye
#  Tesseract en español para leer fotos de la exógena.
#
#  Crear el servicio:
#    1. Render → New → Blueprint → repositorio wnqbebb/carlos-cruz-contabilidad.
#    2. Render pide DOS valores (sync:false). Los escribe el usuario, nunca el chat:
#         DATABASE_URL           Supabase → Connect → Transaction pooler (puerto 6543)
#         CC_CODIGO_INSTALACION  un código que usted inventa; se pide una sola vez
#                                al crear el acceso en la nube.
#    3. Las claves de sesión y de cifrado las genera Render solo (generateValue).
#  El nombre del servicio debe ser carloscruz-api: es el destino de vercel.json.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: carloscruz-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: ALMACENAMIENTO
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: CC_CODIGO_INSTALACION
        sync: false
      # Firma de las sesiones y clave AES-256 de los datos cifrados. En Render el disco se
      # borra en cada reinicio: si estas claves no vinieran del entorno se perderían.
      - key: CLAVE_SESION
        generateValue: true
      - key: CC_CLAVE_DATOS
        generateValue: true
      # Linux sin Administrador de credenciales; sin respaldos ni registros en el disco efímero.
      - key: CC_SIN_LLAVERO
        value: "1"
      - key: CC_MIGRAR_SECRETOS
        value: "0"
      - key: CC_SIN_RESPALDO
        value: "1"
      - key: CORS_ORIGENES
        value: https://carlos-cruz-contabilidad.vercel.app,http://localhost:5173,http://localhost:8000
