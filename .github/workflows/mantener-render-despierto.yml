# Mantiene despierto el servidor de Render (plan gratuito) en horario de oficina.
#
# Render gratis apaga el servidor a los 15 minutos sin visitas y despertarlo tarda
# 30-60 segundos (la pantalla muestra «Despertando el servidor…»). Esta tarea lo visita
# cada 10 minutos de 6:00 a.m. a 10:00 p.m. (hora de Colombia), pasando por Vercel, que es
# la misma puerta que usa el contador. No necesita claves: /api/salud es público.
#
# Gratis: el repositorio es público, así que GitHub no cobra los minutos de Actions.
# Ojo: GitHub pausa las tareas programadas si el repositorio pasa 60 días sin cambios;
# basta con entrar a Actions y pulsar «Enable workflow».
# Opción de pago: Render «Starter» (7 USD/mes) nunca se duerme y hace innecesaria esta tarea.
name: Mantener Render despierto

on:
  schedule:
    # 11:00–02:59 UTC = 6:00 a.m.–9:59 p.m. en Colombia (UTC-5).
    - cron: "*/10 11-23,0-2 * * *"
  workflow_dispatch: {}

jobs:
  visitar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visitar /api/salud
        run: |
          for intento in 1 2 3 4; do
            if curl -fsS --max-time 60 https://carlos-cruz-contabilidad.vercel.app/api/salud; then
              echo; echo "Servidor despierto."; exit 0
            fi
            echo "Intento $intento: todavía despertando…"; sleep 15
          done
          echo "El servidor no respondió. Revise el panel de Render."
          exit 1
